plugins {
    id 'com.android.application'
}

android {
    namespace 'com.retro.subsonic'
    compileSdk 33

    defaultConfig {
        applicationId "com.retro.subsonic"
        minSdk 16
        targetSdk 28
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}

dependencies {
}
