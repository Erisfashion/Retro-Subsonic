name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 核心修复：通过 Python 一行安全解码并还原绝对固定的标准 Keystore，永不改变
      - name: Restore Permanent Fixed Keystore
        run: |
          python3 -c "import base64, os; p = os.path.expanduser('~/.android'); os.makedirs(p, exist_ok=True); open(os.path.join(p, 'debug.keystore'), 'wb').write(base64.b64decode(''))"
          # 校验输出，确保 PrivateKeyEntry 存在
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey

      - name: Setup Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubsonicMusic-v1.0.3
          path: app/build/outputs/apk/debug/*.apk
