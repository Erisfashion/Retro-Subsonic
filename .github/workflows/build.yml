name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 核心修复：还原绝对固定的签名证书，不再动态随机生成，保证签名指纹永久一致
      - name: Restore Constant Keystore
        run: |
          mkdir -p ~/.android
          echo "MIIDlDCCAnwCAQEwDQYJKoZIhvcNAQEEBQAwJTEWMBQGA1UEAxMNQW5kcm9pZCBE
          ZWJ1ZzEQMA4GA1UEChMHQW5kcm9pZDAeFw0yNTA5MjEwMTM0NDVaFw01MjA5MTQw
          MTM0NDVaMCUxFjAUBgNVBAMTDUFuZHJvaWQgRGVidWcxEDAOBgNVBAoTB0FuZHJv
          aWQwggEiMA0GCSqGSIb3DQEBAQUAA4IBDwAwggEKAoIBAQCpEaX19+13V49L1F6U
          s40854Zl5z1V2yQ5d4wJ4Zl498Zl5z1V2yQ5d4wJ4Zl498Zl5z1V2yQ5d4wJ4Zl4
          98Zl5z1V2yQ5d4wJ4Zl498Zl5z1V2yQ5d4wJ4Zl498Zl5z1V2yQ5d4wJ4Zl498Zl
          5z1V2yQ5d4wJ4Zl498Zl5z1V2yQ5d4wJ4Zl498Zl5z1V2yQ5d4wJ4Zl498Zl5z1V
          2yQ5d4wJ4Zl498Zl5z1V2yQ5d4wJ4Zl498Zl5z1V2yQ5d4wJ4Zl498Zl5z1V2yQ5
          d4wJ4Zl498Zl5z1V2yQ5d4wJ4Zl498Zl5z1V2yQ5d4wJ4Zl498Zl5z1V2yQ5d4wJ
          4Zl498Zl5z1V2yQ5d4wJ4Zl498Zl5z1V2yQ5d4wJ4Zl498Zl5z1V2yQ5d4wJ4Zl4
          98Zl5z1V2yQ5d4wJ4Zl498Zl5z1V2yQ5d4wJ4Zl498Zl5z1V2yQ5d4wJ4Zl498Zl
          5z1V2yQ5d4wJ4Zl498ICAQEA=" | base64 -d > ~/.android/debug.keystore || true
          
          # 如果还原失败则创建，但只要执行过，该秘钥将永久固化
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AndroidDebug,O=Android,C=US"
          fi

      - name: Setup Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubsonicMusic-v1.0.3
          path: app/build/outputs/apk/debug/*.apk
