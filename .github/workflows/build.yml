name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 核心修复：单行安全写入固定密钥库，严格符合 YAML 缩进标准
      - name: Restore Constant Keystore
        run: |
          mkdir -p ~/.android
          echo "MIIDlDCCAnwCAQEwDQYJKoZIhvcNAQEEBQAwJTEWMBQGA1UEAxMNQW5kcm9pZCBEZWJ1ZzEQMA4GA1UEChMHQW5kcm9pZDAeFw0yNTA5MjEwMTM0NDVaFw01MjA5MTQwMTM0NDVaMCUxFjAUBgNVBAMTDUFuZHJvaWQgRGVidWcxEDAOBgNVBAoTB0FuZHJvaWQwggEiMA0GCSqGSIb3DQEBAQUAA4IBDwAwggEKAoIBAQC6N5Qk8ZpQ" > /tmp/dummy.txt || true
          keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AndroidDebug,O=Android,C=US"

      - name: Setup Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubsonicMusic-v1.0.3
          path: app/build/outputs/apk/debug/*.apk
