name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Constant Keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AndroidDebug,O=Android,C=US"
          fi

      # 关键修复：通过指定兼容版本（如 7.5.1 或 8.0）生成 wrapper，规避 Gradle 9.x 破坏性 API 变更
      - name: Ensure Compatible Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating Gradle 7.5.1 wrapper..."
            gradle wrapper --gradle-version 7.5.1 --distribution-type bin || gradle wrapper --gradle-version 8.0 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build APK with Gradle Wrapper
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubsonicMusic-v1.0.3
          path: app/build/outputs/apk/debug/*.apk
