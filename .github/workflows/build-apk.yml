name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 设置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 自动接受 Android SDK 协议许可
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 生成永久固定 debug 签名秘钥库，确保指纹一致，支持直接覆盖安装
      - name: Generate Constant Keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AndroidDebug,O=Android,C=US"
          fi

      # 关键修复：如果根目录缺失 gradlew，使用系统环境的 gradle 自动补齐 wrapper
      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper using system gradle..."
            gradle wrapper
          fi
          chmod +x gradlew

      # 编译生成 Debug APK
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      # 产出并上传 APK 文件
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubsonicMusic-v1.0.3
          path: app/build/outputs/apk/debug/*.apk
